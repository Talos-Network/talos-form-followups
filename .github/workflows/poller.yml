# The poller: reads replies and reactions in each Pending draft's Slack
# thread, and acts — send + stamp Sent on approval (per config.SEND_MODE's
# safety ladder), revise on edit requests, stamp Rejected on skip, ask when
# unclear. Sending only ever happens here, and only after a clear approval.
name: poller

on:
  schedule:
    # Every 15 minutes (docs/decisions.md #7). GitHub may delay scheduled
    # runs by a few minutes under load; workflow_dispatch is the "act now"
    # button when a delay matters.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    # Most runs finish in seconds (nothing to do); this cap is generous.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 poller_job.py
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Gmail credentials are only exercised when SEND_MODE is
          # "self" or "live" (config.py); harmless otherwise.
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
